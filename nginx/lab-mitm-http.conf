# Sitio del laboratorio lab-mitm-http (instalado por instalar.sh).
# nginx hace de proxy: recibe las peticiones en el puerto 8090 y se las pasa a la
# aplicación de 127.0.0.1:8002. Solo escucha en 127.0.0.1: no es accesible desde la red.
server {
	listen 127.0.0.1:8090;
	server_name localhost;

	# No revelar la versión exacta de nginx en cabeceras y páginas de error.
	server_tokens off;

	# Registros propios del laboratorio.
	access_log /var/log/nginx/lab-mitm-http.access.log;
	error_log /var/log/nginx/lab-mitm-http.error.log;

	location / {
		proxy_pass http://127.0.0.1:8002;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
}
